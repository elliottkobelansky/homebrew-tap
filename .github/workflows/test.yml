name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: Homebrew/actions/setup-homebrew@master
      - name: Install and test from this tap
        run: |
          brew tap elliottkobelansky/tap "https://github.com/${GITHUB_REPOSITORY}"
          cd "$(brew --repository elliottkobelansky/tap)" && git fetch -q origin "$GITHUB_SHA" && git checkout -q "$GITHUB_SHA"
          brew install --build-from-source elliottkobelansky/tap/typerace
          brew test elliottkobelansky/tap/typerace
          typerace --version
